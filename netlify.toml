# Netlify configuration for The Concierge Gynecologist
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Plain static site — no build step. Every page is a real file in its own
# folder (/expertise/index.html, /questions/index.html, ...), so no SPA
# fallback redirect is needed. Unknown URLs get /404.html.
#
# Only site/ is published. Everything else in the repo — BRAND-GUIDE.md,
# docs/, README, partials/, tools/, function source — is working material
# and must never be reachable on the web (moved here 29 Oct 2026, after
# /BRAND-GUIDE.md and /docs/LAUNCH-GUIDE.md were found to be public).
# Header paths below are relative to site/.

[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

# ── Caching: images and videos are treated as immutable (add new files
# rather than overwrite existing ones), so browsers and the CDN keep them
# for a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS change between deploys without renamed files — always revalidate.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep the admin page out of search results entirely
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Unsubscribe links carry an email address: keep the page out of search
# results and never cache it. (No-referrer is set by a meta tag in the page,
# so it does not collide with the site-wide Referrer-Policy below.)
[[headers]]
  for = "/unsubscribe/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# ── Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "upgrade-insecure-requests"
